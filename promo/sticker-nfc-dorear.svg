<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
      .font-serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .font-sans { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    
    <!-- Sutil degradé dorado -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88f4e"/>
      <stop offset="50%" stop-color="#a67c3f"/>
      <stop offset="100%" stop-color="#8c642b"/>
    </linearGradient>

    <!-- Sombra suave para impresión/vista previa -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#372e25" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fondo circular principal (Color crema/papel oficial) -->
  <circle cx="300" cy="300" r="290" fill="#faf7f0" filter="url(#softShadow)"/>

  <!-- Anillos concéntricos dorados de borde -->
  <circle cx="300" cy="300" r="275" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Emblema Oficial AR con Batidor de Pastelería (Agustina Ramírez) -->
  <g id="logo-emblem-ar">
    <!-- Cápsula / Óvalo exterior -->
    <rect x="270" y="44" width="60" height="106" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Letra A arriba -->
    <text x="300" y="66" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="600" fill="#a67c3f" text-anchor="middle" letter-spacing="1">A</text>
    
    <!-- Batidor de alambre pastelero central -->
    <g stroke="#a67c3f" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Globo de alambres del batidor -->
      <ellipse cx="300" cy="94" rx="13" ry="14" stroke-width="1.3"/>
      <ellipse cx="300" cy="94" rx="6.5" ry="14" stroke-width="1.1"/>
      <line x1="300" y1="80" x2="300" y2="108" stroke-width="1.2"/>
      
      <!-- Cuello / virola del batidor -->
      <rect x="296" y="108" width="8" height="2.5" rx="1" fill="#a67c3f" stroke="none"/>
      
      <!-- Mango cilíndrico del batidor hacia abajo -->
      <rect x="297.5" y="111" width="5" height="13" rx="2.5" stroke-width="1.2"/>
    </g>

    <!-- Letra R abajo -->
    <text x="300" y="141" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="600" fill="#a67c3f" text-anchor="middle" letter-spacing="1">R</text>
  </g>

  <!-- Marca DOREAR -->
  <text x="300" y="195" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" font-weight="400" fill="#a67c3f" text-anchor="middle" letter-spacing="10">DOREAR</text>

  <!-- Subtítulo oficial -->
  <text x="300" y="222" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="500" fill="#372e25" text-anchor="middle" letter-spacing="3" text-transform="uppercase">PUERTO MADERO</text>

  <!-- Línea divisoria fina con detalle -->
  <path d="M200 242h200" stroke="#a67c3f" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="300" cy="242" r="3" fill="#a67c3f"/>

  <!-- Ícono NFC / Contactless + Celular -->
  <g transform="translate(300, 315)">
    <!-- Halo exterior de onda NFC -->
    <circle cx="0" cy="0" r="46" fill="#f3ede2" fill-opacity="0.6"/>

    <!-- Silueta moderna de smartphone -->
    <rect x="-18" y="-30" width="36" height="60" rx="6" fill="#fffcf7" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <!-- Pantalla / notch -->
    <line x1="-6" y1="-24" x2="6" y2="-24" stroke="#a67c3f" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Ondas de transmisión Contactless (NFC) en oro -->
    <path d="M-8 -6 a14 14 0 0 1 16 0" fill="none" stroke="#a67c3f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-13 -13 a22 22 0 0 1 26 0" fill="none" stroke="#a67c3f" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="1" r="2.5" fill="#a67c3f"/>
  </g>

  <!-- Llamado a la acción principal -->
  <text x="300" y="415" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" font-style="italic" fill="#372e25" text-anchor="middle">
    Apoyá tu celu acá
  </text>

  <!-- Píldora / Badge Menú Digital -->
  <g transform="translate(300, 460)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#672d35"/>
    <text x="0" y="5" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#faf7f0" text-anchor="middle" letter-spacing="2">
      VER CARTA DIGITAL
    </text>
  </g>

  <!-- Frase célebre de la carta (sin corazón) -->
  <text x="300" y="528" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-style="italic" fill="#8c642b" text-anchor="middle">
    Que espere todo, este ratito es tuyo
  </text>
</svg>
